server {
    listen 80;
    server_name www.selectdancestudio.com;
    return 301 https://selectdancestudio.com$request_uri;
}

server {
    listen 80 default_server;
    server_name selectdancestudio.com localhost _;
    client_max_body_size 10M;

    # Compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Redirecciones de URLs públicas anteriores
    location = /competition {
        return 301 /competencia-danza-palermo;
    }

    location = /clase-de-prueba {
        return 301 /contacto;
    }

    location = /gimnasia-artistica-palermo {
        return 301 /gimnasia-acrobatica-palermo;
    }

    # Frontend React con HTML prerenderizado para rutas públicas
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Proxy API → Backend Node.js
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # ── Transmisión en vivo (HLS) ──────────────────────────────
    # El video se sirve por el mismo origen que el portal, protegido:
    # antes de entregar cada pedido, nginx consulta al backend (auth_request)
    # si quien pide es un padre con clase en vivo. Si no, 401/403.
    location /live/ {
        auth_request /_live_auth;
        proxy_pass http://mediamtx:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "no-cache";
    }

    # Sub-request interno de autorización (no accesible directo desde afuera)
    location = /_live_auth {
        internal;
        proxy_pass http://backend:5000/api/transmisiones/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy archivos subidos (comprobantes, etc.)
    location /uploads {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy assets públicos (imágenes de cursos, logo)
    location /assets/public {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
